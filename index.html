<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetShop Amigo Fiel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <div class="logo">
        <img src="img/logo-transparente.png" alt="logotipo do PetShop Amigo Fiel"
        width="100"
        />
      </div>

      <button id="menu-btn">☰</button>

      <nav id="menu">
        <a href="#home">home</a>
        <a href="#servicos">serviços</a>
        <a href="#galeria">galeria</a>
        <a href="#contato">contato</a>
        <a href="#localizacao">localização</a>

      </nav>
    </header>

    <!-- HERO -->
    <section id="home" class="hero">
      <div class="hero-content">
        <h1>cuidando do seu melhor Amigo</h1>
        <p>banho, tosa, veterinario e muito carinho</p>
        <a href="#contato"></a>
      </div>
    </section>

    <!-- SERVIÇOS -->
    <section id="servicos" class="container">
      <h2>nossos servicos</h2>
      
      <div class="card">
        <img src="img/banho.png" alt="serviço de banho">
        <h3>banho</h3>
        <p>banho completo e hidratação</p>
      </div>
    </section>

    <!-- GALERIA -->
    <section id="galeria" class="container"></section>

    <!-- CONTATO -->
    <section id="contato" class="container"></section>

    <!-- MAPA -->
    <section id="localizacao" class="container"></section>

    <!-- FOOTER -->
    <footer></footer>

    <script src="js/script.js"></script>
  </body>
</html>
